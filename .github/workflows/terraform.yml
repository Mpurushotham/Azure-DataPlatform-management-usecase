# =============================================================================
# Terraform — validate, scan, plan on PR; gated apply on main
# =============================================================================
# Kept in lockstep with azure-pipelines/terraform-pipeline.yml. Neither file
# contains policy logic: both call `make` targets, so a gate can only diverge if
# someone edits a target list, not by one pipeline quietly drifting from the
# other. That is the acceptance criterion behind ADR-013 — a service can move
# between CI platforms without its security posture changing.
#
# Runs green in a repository with no Azure configuration at all. The static
# gates need no credentials; the Azure-dependent stages are guarded on
# `vars.AZURE_CLIENT_ID` and skip cleanly until `terraform/bootstrap` has been
# applied and its outputs recorded as repository variables. A pipeline that
# fails on first commit is a pipeline nobody trusts afterwards.
#
# No secret is stored. Azure access is OIDC federation into the identity
# terraform/bootstrap creates; the variables below are identifiers, not
# credentials.
# =============================================================================

name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'policies/**'
      - 'dags/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'policies/**'
      - 'dags/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Minting the OIDC token exchanged for an Azure credential.
  id-token: write
  # Uploading the Trivy SARIF to code scanning.
  security-events: write
  pull-requests: write

env:
  TERRAFORM_VERSION: '1.9.8'
  TFLINT_VERSION: 'v0.53.0'
  TRIVY_VERSION: '0.58.1'

concurrency:
  # One run per branch. Two concurrent applies against the same state produce a
  # lock timeout, which looks like a hang rather than a conflict.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Static checks: no Azure, no credentials, fast ───────────────────────────
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: make fmt-check

      - name: Validate all roots
        run: make validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Lint
        run: make lint

      # The cluster-policy security contract. This is the check that catches a
      # control being weakened from `fixed` to editable — a change a Terraform
      # plan diff shows but a reviewer skims past.
      - name: Cluster policy contract
        run: make policy-test

      - name: Airflow DAG import check
        run: make dag-test

  # ── Security scanning ───────────────────────────────────────────────────────
  scan:
    name: scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Report HIGH and CRITICAL to code scanning. Non-blocking: a gate that
      # blocks on HIGH in a repo this size blocks on things nobody intends to
      # fix, and a gate people routinely override is not a gate.
      - name: Trivy IaC scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: sarif
          output: trivy.sarif
          trivyignores: .trivyignore.yaml
        env:
          TRIVY_SKIP_DB_UPDATE: 'false'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-iac

      # CRITICAL blocks the build. Every suppression in .trivyignore.yaml states
      # what it covers, why it is acceptable, and carries an expiry date.
      - name: Trivy IaC scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore.yaml

  # ── Plan against real Azure ─────────────────────────────────────────────────
  # Pull requests only, using the `pull_request` federated subject, which has
  # read intent. A fork PR cannot select a GitHub Environment, which is what
  # stops it reaching the apply credential.
  #
  # Skips entirely until AZURE_CLIENT_ID is set as a repository variable.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    needs: [validate, scan]
    if: github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != ''
    environment: sandbox
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write backend config
        run: |
          cat > terraform/envs/sandbox/backend.hcl <<EOF
          resource_group_name  = "${{ vars.TFSTATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          container_name       = "tfstate-yoda-sandbox"
          key                  = "sandbox.terraform.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Plan
        id: plan
        env:
          # The provider reads the OIDC token azure/login placed in the
          # environment; ARM_USE_OIDC is what tells it to.
          ARM_USE_OIDC: 'true'
          ARM_USE_AZUREAD: 'true'
          # ARM_*, not AZURE_*. azure/login exports AZURE_CLIENT_ID and
          # AZURE_TENANT_ID, which the azurerm *backend* does not read — and a
          # backend block cannot take Terraform variables, so the values have to
          # arrive through the environment. Without these, init fails with
          # "a Tenant ID must be configured when authenticating with OIDC" even
          # though the Azure login plainly succeeded.
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_unique_suffix: ${{ vars.UNIQUE_SUFFIX }}
          # Without these three, CI plans against variable defaults and produces
          # a different plan than the operator: empty operator_ip_ranges removes
          # the AKS API allowlist and the storage firewall rule, empty
          # budget_alert_emails destroys the action-group receivers, and empty
          # platform_admin_object_ids drops the AKS admin group binding.
          # Everything else the environment needs is committed in
          # environment.auto.tfvars.
          TF_VAR_operator_ip_ranges: ${{ format('["{0}"]', secrets.OPERATOR_IP_CIDR) }}
          TF_VAR_budget_alert_emails: ${{ format('["{0}"]', secrets.ALERT_EMAIL) }}
          TF_VAR_platform_admin_object_ids: ${{ format('["{0}"]', vars.PLATFORM_ADMIN_OBJECT_ID) }}
        run: |
          set -o pipefail
          make init ENV=sandbox
          make plan ENV=sandbox 2>&1 | tee plan.txt
          {
            echo 'summary<<PLANEOF'
            # Strip ANSI first: `make plan` colourises, so the summary line
            # starts with escape codes and an anchored grep never matches it.
            sed 's/\x1b\[[0-9;]*m//g' plan.txt \
              | grep -E '^(Plan:|No changes|Error:)' \
              || echo 'Plan produced no summary line'
            echo 'PLANEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan summary
        uses: actions/github-script@v8
        env:
          # Passed through the environment, not interpolated into the script
          # body. A plan summary interpolated directly would break the template
          # literal on any backtick or quote it contains, and is an injection
          # path besides.
          PLAN_SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const summary = process.env.PLAN_SUMMARY || 'no summary produced';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ['### Terraform plan — `sandbox`', '', '```', summary, '```'].join('\n')
            });

  # ── Apply ───────────────────────────────────────────────────────────────────
  # Gated on the GitHub Environment, which carries its own reviewer rules. The
  # federated credential subject is environment-scoped, so this job cannot run
  # without that gate being satisfied — the protection is in Entra, not only in
  # the workflow file.
  apply:
    name: apply
    runs-on: ubuntu-24.04
    needs: [validate, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    environment: sandbox
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Quota preflight
        # Two seconds here beats discovering the quota twelve minutes into an
        # AKS create, with a half-built cluster left behind.
        run: ./scripts/bash/check-quota.sh sandbox

      - name: Write backend config
        run: |
          cat > terraform/envs/sandbox/backend.hcl <<EOF
          resource_group_name  = "${{ vars.TFSTATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          container_name       = "tfstate-yoda-sandbox"
          key                  = "sandbox.terraform.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Apply
        env:
          ARM_USE_OIDC: 'true'
          ARM_USE_AZUREAD: 'true'
          # See the note in the plan job — the backend reads ARM_*, not AZURE_*.
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AUTO_APPROVE: '1'
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_unique_suffix: ${{ vars.UNIQUE_SUFFIX }}
          # Without these three, CI plans against variable defaults and produces
          # a different plan than the operator: empty operator_ip_ranges removes
          # the AKS API allowlist and the storage firewall rule, empty
          # budget_alert_emails destroys the action-group receivers, and empty
          # platform_admin_object_ids drops the AKS admin group binding.
          # Everything else the environment needs is committed in
          # environment.auto.tfvars.
          TF_VAR_operator_ip_ranges: ${{ format('["{0}"]', secrets.OPERATOR_IP_CIDR) }}
          TF_VAR_budget_alert_emails: ${{ format('["{0}"]', secrets.ALERT_EMAIL) }}
          TF_VAR_platform_admin_object_ids: ${{ format('["{0}"]', vars.PLATFORM_ADMIN_OBJECT_ID) }}
        run: |
          set -o pipefail
          make init  ENV=sandbox
          make plan  ENV=sandbox
          make apply ENV=sandbox
