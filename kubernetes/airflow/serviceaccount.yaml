# =============================================================================
# Airflow ServiceAccount — the workload identity anchor
# =============================================================================
# Created here rather than by the Helm chart. The chart has a per-component
# `serviceAccount` block but no single global one, so setting `create: true` at
# the top level does nothing and every component then fails to schedule with
# "serviceaccount \"airflow\" not found".
#
# Owning it explicitly is better anyway: this ServiceAccount is the subject of
# the Entra federated credential created in terraform/modules/aks-platform, and
# that binding is the thing the whole no-secrets design rests on. It should be
# visible in the repository, not buried in chart defaults.
#
#   federated credential subject:
#     system:serviceaccount:airflow:airflow
#
# The annotation names the Entra identity; the label on the *pod* is what makes
# the webhook inject the projected token. Both are required — with only the
# annotation nothing happens, and the failure looks like a permissions problem
# rather than a missing label.
#
# AIRFLOW_CLIENT_ID is substituted by scripts/bash/deploy-platform.sh from the
# Terraform output. It is a client ID, not a secret.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow
  namespace: airflow
  labels:
    app: airflow
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: AIRFLOW_CLIENT_ID
# No imagePullSecrets: the kubelet identity holds AcrPull on the registry, so
# image pulls need no credential in the cluster either.
automountServiceAccountToken: true
